# Builds the Docker image (without publishing it), to detect broken installs early:
# a changed `Remotes:` entry, a missing system library, a renamed launcher function, ...
name: docker-build

on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, compose.yaml, DESCRIPTION, "R/**", "inst/**", NAMESPACE]
  pull_request:
    branches: [main]
    paths: [Dockerfile, .dockerignore, compose.yaml, DESCRIPTION, "R/**", "inst/**", NAMESPACE]
  workflow_dispatch:

permissions: read-all

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rndc-shiny:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The package loads in the image
        run: docker run --rm rndc-shiny:ci R -q -e 'library(rNDC.Shiny); stopifnot(is.function(ndc_gui)); packageVersion("rNDC")'
