# Runs the live API tests against the real services, to detect changes in the APIs (renamed
# collections, changed parameters, ...). Needs the repository secrets NDC_TOKEN and ADC_TOKEN.
#
# - Scheduled runs happen on the default branch only.
# - To run it on another branch: Actions > live-checks > Run workflow > choose the branch.
name: live-checks

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  live-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NDC_TOKEN: ${{ secrets.NDC_TOKEN }}
      ADC_TOKEN: ${{ secrets.ADC_TOKEN }}
      RNDC_LIVE_TESTS: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Check that the API tokens are available
        run: |
          if [ -z "$NDC_TOKEN" ] || [ -z "$ADC_TOKEN" ]; then
            echo "::error::Add the NDC_TOKEN and ADC_TOKEN repository secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          needs: check

      - name: Live API tests
        run: Rscript -e 'devtools::test(filter = "live", stop_on_failure = TRUE)'
